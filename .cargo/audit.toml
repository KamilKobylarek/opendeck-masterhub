# cargo audit exceptions, each with why it doesn't reach the plugin. Remove an entry once rumqttc updates.
[advisories]
ignore = [
    # rustls-webpki 0.102.8 comes with rumqttc 0.25.1, which only names its error type (`webpki::Error` in
    # rumqttc's tls.rs). Certificates are checked by rustls 0.23 with rustls-webpki 0.103.16, which has the
    # fixes; the plugin builds its own rustls ClientConfig (mqtt.rs, TlsConfiguration::Rustls).
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
    # rustls-pemfile is unmaintained; rumqttc only uses it for TlsConfiguration::Simple, which the plugin doesn't
    # use (it reads the CA file with rustls's own PEM parser).
    "RUSTSEC-2025-0134",
]
# Warnings that aren't vulnerabilities and so don't fail the audit: zbus_names, zvariant and zvariant_derive are
# marked unmaintained (RUSTSEC-2026-0370..0372); they come with keyring's Secret Service store on Linux only.
