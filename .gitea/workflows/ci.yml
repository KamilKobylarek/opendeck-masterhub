name: CI

# Pushes only, not pull requests: the runners are self-hosted in host mode (your own Mac and PC, the same ones
# that build releases), so code from someone else's pull request must never run on them.
on:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Self-hosted host-mode runners, see ci/setup-runner-*.{sh,ps1}
        os: [macos, windows]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: builtin:checkout
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  # Linux in a Debian container on the Mac runner (needs Docker Desktop there).
  linux:
    runs-on: macos
    steps:
      - uses: builtin:checkout
      - run: sh ci/linux.sh

  # Known vulnerabilities in the dependencies (exceptions, with why, in .cargo/audit.toml).
  audit:
    runs-on: macos
    steps:
      - uses: builtin:checkout
      - run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
          cargo audit
