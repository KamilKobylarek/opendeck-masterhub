<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; color: #d8d8d8; background: transparent; margin: 0; padding: 8px; }
  label { display: block; margin: 8px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; font: 12px ui-monospace, monospace; background: #2d2d2d; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px; }
  p { color: #9a9a9a; margin: 6px 0; line-height: 1.4; }
  code { color: #ccc; }
  input[type=checkbox] { width: auto; margin-right: 6px; vertical-align: middle; }
</style>
<div id="graphRow" hidden>
  <label><input type="checkbox" id="graph">Graph of the last 2 minutes</label>
  <label for="alarmAbove">Alarm above</label>
  <input id="alarmAbove" type="number" step="any" placeholder="optional, e.g. 90">
  <label for="alarmBelow">Alarm below</label>
  <input id="alarmBelow" type="number" step="any" placeholder="optional">
  <p>Past a limit the screen flashes red every other second (a knob's or fader's LED follows it).</p>
</div>
<label for="press">On press</label>
<select id="press">
  <option value="">Nothing</option>
  <option value="open">Open an app, file or web address</option>
  <option value="command">Run a command</option>
  <option value="next">Next screen (clock, CPU, memory, GPU…)</option>
</select>
<div id="targetRow" hidden>
  <label for="target" id="targetLabel">What to open</label>
  <input id="target">
  <p id="hint"></p>
</div>
<script>
// Stream Deck property inspector protocol, which OpenDeck implements.
const HINTS = {
  mac: { open: ['/System/Applications/Utilities/Activity Monitor.app', 'An app, a file or an address (https://…).'],
         command: ['open -a "Activity Monitor"', 'Runs in the shell (<code>sh</code>).'] },
  windows: { open: ['https://…  or  C:\\Windows\\System32\\Taskmgr.exe', 'An app, a file or an address.'],
             command: ['taskmgr', 'Runs in <code>cmd</code>.'] },
  linux: { open: ['https://…  or  a file', 'Opened with <code>xdg-open</code>.'],
           command: ['gnome-system-monitor', 'Runs in the shell (<code>sh</code>).'] },
};
const fields = ['press', 'target'].map((id) => document.getElementById(id));
let socket, context, platform = 'mac';
function show() {
  const press = document.getElementById('press').value;
  const row = document.getElementById('targetRow');
  row.hidden = press !== 'open' && press !== 'command';
  if (row.hidden) return;
  const [placeholder, hint] = (HINTS[platform] || HINTS.linux)[press];
  document.getElementById('target').placeholder = placeholder;
  document.getElementById('hint').innerHTML = hint;
  document.getElementById('targetLabel').textContent = press === 'open' ? 'What to open' : 'Command';
}
function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
  context = uuid;
  platform = (JSON.parse(info).application || {}).platform || 'mac';
  const settings = JSON.parse(actionInfo).payload.settings || {};
  for (const f of fields) f.value = settings[f.id] || '';
  // the clocks have no value to draw
  const graph = document.getElementById('graph');
  document.getElementById('graphRow').hidden = /clock$/.test(JSON.parse(actionInfo).action || '');
  graph.checked = settings.graph === true;
  graph.addEventListener('change', () => {
    settings.graph = graph.checked;
    if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ event: 'setSettings', context, payload: settings }));
  });
  for (const id of ['alarmAbove', 'alarmBelow']) {
    const f = document.getElementById(id);
    f.value = settings[id] ?? '';
    f.addEventListener('input', () => {
      settings[id] = f.value;
      if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ event: 'setSettings', context, payload: settings }));
    });
  }
  show();
  socket = new WebSocket(`ws://127.0.0.1:${port}`);
  socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid }));
  // the plugin changes the settings too ("next screen" keeps the screen chosen): keep up with them
  socket.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.event === 'didReceiveSettings' && msg.context === context) Object.assign(settings, msg.payload.settings || {});
  };
  for (const f of fields) {
    f.addEventListener(f.tagName === 'SELECT' ? 'change' : 'input', () => {
      show();
      if (socket.readyState !== WebSocket.OPEN) return;
      // keep the screen chosen by "next screen" presses
      socket.send(JSON.stringify({ event: 'setSettings', context, payload: Object.assign(settings, { press: fields[0].value, target: fields[1].value }) }));
    });
  }
}
</script>
