<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; color: #d8d8d8; background: transparent; margin: 0; padding: 8px; }
  label { display: block; margin: 8px 0 4px; }
  input { width: 100%; box-sizing: border-box; font: 12px ui-monospace, monospace; background: #2d2d2d; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px; }
  p { color: #9a9a9a; margin: 6px 0; line-height: 1.4; }
  code { color: #ccc; }
</style>
<label for="command">Command on turn / slide</label>
<input id="command" placeholder="ddcctl -d 1 -b {value}">
<p>On a MasterHUB fader <code>{value}</code> is its position (0–100); on knobs, rollers and the dial
  <code>{ticks}</code> is the clicks turned (negative = left). Runs in the system shell (<code>sh</code>,
  <code>cmd</code> on Windows); while a fader moves only its last position runs.</p>
<label for="pressCommand">Command on press</label>
<input id="pressCommand" placeholder="optional">
<script>
// Stream Deck property inspector protocol, which OpenDeck implements.
const fields = ['command', 'pressCommand'].map((id) => document.getElementById(id));
let socket, context;
function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
  context = uuid;
  const settings = JSON.parse(actionInfo).payload.settings || {};
  for (const f of fields) f.value = settings[f.id] || '';
  socket = new WebSocket(`ws://127.0.0.1:${port}`);
  socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid }));
  for (const f of fields) {
    f.addEventListener('input', () => {
      if (socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ event: 'setSettings', context, payload: Object.fromEntries(fields.map((x) => [x.id, x.value])) }));
    });
  }
}
</script>
